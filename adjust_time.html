<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Adjust Break Time - Tech Break Timer</title>
    <!-- iOS & Standalone Fullscreen PWA Settings -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Tech Timer">
    <meta name="application-name" content="Tech Timer">
    <meta name="theme-color" content="#0b1020">
    <link rel="manifest" href="./manifest.json">
    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="./assets/icons/icon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="./assets/icons/favicon-16x16.png">
    <link rel="shortcut icon" href="./favicon.ico">
    <!-- Apple & Android Touch Icons -->
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/icons/icon-180.png">
    <link rel="icon" type="image/png" sizes="192x192" href="./assets/icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="./assets/icons/icon-512.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #4CAF50; /* Calm green */
            --secondary-color: #FFC107; /* Bright yellow */
            --accent-color: #3D5AFE; /* Bold blue */
            --danger-color: #f44336; /* Softer red */
            --background-color: #F0F4F8;
            --text-color: #333;
            --card-background: #ffffff;
            --white-color: #ffffff;
        }
        body { font-family: 'Fredoka', sans-serif; background-color: var(--background-color); color: var(--text-color); margin: 0; }
        header { background-color: var(--accent-color); color: var(--white-color); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        header h1 { margin: 0; }
        .back-link { color: var(--white-color); background: rgba(255,255,255,0.2); padding: 0.5rem 1rem; border-radius: 20px; text-decoration: none; font-weight: 500; transition: background 0.2s; }
        .back-link:hover { background: rgba(255,255,255,0.4); }
        main { display: flex; flex-direction: column; padding: 1.5rem; gap: 1.5rem; }
        @media(min-width: 900px) { main { flex-direction: row; align-items: flex-start; } }
        .panel { background: var(--card-background); border-radius: 20px; padding: 1.5rem; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .child-info-panel { flex: 1; text-align: center; }
        .child-info-panel h2 { margin-top: 0; color: var(--accent-color); }
        .actions-panel { flex: 2; }
        .actions-panel h2 { margin-top: 0; color: var(--accent-color); }
        #child-name { font-size: 2rem; font-weight: 700; margin-bottom: 0.5rem; }
        #child-age { font-size: 1.2rem; color: #555; margin-bottom: 1rem; }
        #current-time { font-size: 2.5rem; font-weight: 700; color: var(--accent-color); }
        .actions-container { display: grid; grid-template-columns: 1fr; gap: 1.5rem; }
        @media(min-width: 600px) { .actions-container { grid-template-columns: 1fr 1fr; } }
        .actions-column h3 { margin-top: 0; padding-bottom: 0.5rem; border-bottom: 2px solid var(--background-color); }
        .actions-column.positive h3 { color: var(--primary-color); }
        .actions-column.negative h3 { color: var(--danger-color); }
        .actions-grid { display: grid; grid-template-columns: 1fr; gap: 0.75rem; }
        .action-btn {
            border: none; padding: 0.75rem; border-radius: 10px;
            font-family: 'Fredoka', sans-serif; font-size: 1rem; cursor: pointer;
            transition: all 0.2s; display: flex; justify-content: space-between; align-items: center;
        }
        .action-btn.positive { background-color: #e8f5e9; }
        .action-btn.positive:hover { background-color: #c8e6c9; }
        .action-btn.negative { background-color: #ffebee; }
        .action-btn.negative:hover { background-color: #ffcdd2; }
        .action-value { font-weight: 700; padding: 0.2rem 0.5rem; border-radius: 5px; color: var(--white-color); }
        .action-btn.positive .action-value { background-color: var(--primary-color); }
        .action-btn.negative .action-value { background-color: var(--danger-color); }
        .loader { text-align: center; padding: 2rem; font-size: 1.5rem; color: #777; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal-overlay.visible { display: flex; }
        .modal-content { background: var(--white-color); padding: 2rem; border-radius: 20px; width: 90%; max-width: 400px; text-align: center; }
    </style>
    <link rel="stylesheet" href="./assets/styles.css">
</head>
<body>
    <header>
        <h1>Adjust Break Time</h1>
        <div class="header-actions">
            <button id="parent-lock-btn" class="parent-lock-pill" title="Parental Controls">
                <span id="parent-lock-icon">🔒</span> <span id="parent-lock-label">Parent Lock: ON</span>
            </button>
            <a href="./index.html" class="back-link">← Back to Break Timers</a>
        </div>
    </header>
    <main id="main-content" style="display: none;">
        <div class="panel child-info-panel">
            <h2>Selected Child</h2>
            <div id="child-name">Child Name</div>
            <div id="child-age"></div>
            <div id="current-time">00:00:00</div>
        </div>
        <div class="panel actions-panel">
            <div class="actions-container">
                <div class="actions-column positive">
                    <h3>✅ Good Behaviour (Earn Time Back)</h3>
                    <div id="positive-actions" class="actions-grid"></div>
                </div>
                <div class="actions-column negative">
                    <h3>❌ Unwanted Behaviour (Add Break Time)</h3>
                    <div id="negative-actions" class="actions-grid"></div>
                </div>
            </div>
        </div>
    </main>
    <div id="loader" class="loader">Loading Child's Data...</div>

    <div id="modal" class="modal-overlay">
        <div class="modal-content">
            <div id="pin-view" class="pin-dialog" style="display:none;">
                <h2 id="pin-title">Parental PIN 🔒</h2>
                <p class="pin-subtitle" id="pin-prompt-text">Enter PIN to edit break time</p>
                <div class="pin-display-container">
                    <div class="pin-dots" id="pin-dots">
                        <div class="pin-dot"></div>
                        <div class="pin-dot"></div>
                        <div class="pin-dot"></div>
                        <div class="pin-dot"></div>
                    </div>
                    <div class="pin-error-text" id="pin-error-msg"></div>
                </div>
                <div class="pin-keypad" id="pin-keypad">
                    <button type="button" class="pin-key-btn" data-key="1">1</button>
                    <button type="button" class="pin-key-btn" data-key="2">2</button>
                    <button type="button" class="pin-key-btn" data-key="3">3</button>
                    <button type="button" class="pin-key-btn" data-key="4">4</button>
                    <button type="button" class="pin-key-btn" data-key="5">5</button>
                    <button type="button" class="pin-key-btn" data-key="6">6</button>
                    <button type="button" class="pin-key-btn" data-key="7">7</button>
                    <button type="button" class="pin-key-btn" data-key="8">8</button>
                    <button type="button" class="pin-key-btn" data-key="9">9</button>
                    <button type="button" class="pin-key-btn action-key" id="pin-clear-btn">Clear</button>
                    <button type="button" class="pin-key-btn" data-key="0">0</button>
                    <button type="button" class="pin-key-btn action-key" id="pin-backspace-btn">⌫</button>
                </div>
                <div style="margin-top: 1.25rem;">
                    <a href="./index.html" class="button button-secondary" style="width: 100%; display: block; box-sizing: border-box;">Cancel & Return</a>
                </div>
                <p style="font-size: 0.8rem; color: var(--muted-text); margin-top: 0.75rem; margin-bottom: 0;">Default PIN: 1234</p>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, updateDoc, increment } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        document.addEventListener('DOMContentLoaded', () => {
            const firebaseConfig = {
                apiKey: "AIzaSyASPRZkzieEbk3H4NyZHYvhSM0X2WZ_ZPk",
                authDomain: "auskick-supercoach.firebaseapp.com",
                projectId: "auskick-supercoach",
                storageBucket: "auskick-supercoach.firebasestorage.app",
                messagingSenderId: "1091558293121",
                appId: "1:1091558293121:web:c226813c3a3afc3c449780"
            };

            const app = initializeApp(firebaseConfig);
            const db = getFirestore(app);
            const auth = getAuth(app);
            signInAnonymously(auth);

            const childrenCollectionPath = `/tech-timer/children/list`;
            let currentChild = null;
            let timerInterval = null;

            const positiveActionsEl = document.getElementById('positive-actions');
            const negativeActionsEl = document.getElementById('negative-actions');
            const childNameEl = document.getElementById('child-name');
            const childAgeEl = document.getElementById('child-age');
            const currentTimeEl = document.getElementById('current-time');
            const mainContentEl = document.getElementById('main-content');
            const loaderEl = document.getElementById('loader');

            // Parental PIN elements
            const parentLockBtn = document.getElementById('parent-lock-btn');
            const parentLockIcon = document.getElementById('parent-lock-icon');
            const parentLockLabel = document.getElementById('parent-lock-label');
            const modal = document.getElementById('modal');
            const pinView = document.getElementById('pin-view');
            const pinPromptText = document.getElementById('pin-prompt-text');
            const pinDotsEl = document.getElementById('pin-dots');
            const pinErrorMsgEl = document.getElementById('pin-error-msg');
            const pinKeypad = document.getElementById('pin-keypad');
            const pinClearBtn = document.getElementById('pin-clear-btn');
            const pinBackspaceBtn = document.getElementById('pin-backspace-btn');

            const AUTH_SESSION_KEY = 'tech_timer_parent_auth';
            const DEFAULT_PIN_HASH = '03ac674216f3e15c761ee1a5e255f067953623c8b388b4459e13f978d7c846f4'; // SHA-256 of "1234"
            const settingsDocRef = doc(db, 'tech-timer', 'settings');
            let activePinHash = DEFAULT_PIN_HASH;

            async function hashPin(pin) {
                const encoder = new TextEncoder();
                const data = encoder.encode(pin);
                const hashBuffer = await crypto.subtle.digest('SHA-256', data);
                const hashArray = Array.from(new Uint8Array(hashBuffer));
                return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            }

            // Real-time synchronization of Parental PIN across all devices
            onSnapshot(settingsDocRef, (docSnap) => {
                if (docSnap.exists() && docSnap.data()?.pinHash) {
                    activePinHash = docSnap.data().pinHash;
                }
            });

            function isParentAuthenticated() {
                return sessionStorage.getItem(AUTH_SESSION_KEY) === 'true';
            }

            function setParentAuthenticated(authenticated) {
                if (authenticated) {
                    sessionStorage.setItem(AUTH_SESSION_KEY, 'true');
                } else {
                    sessionStorage.removeItem(AUTH_SESSION_KEY);
                }
                updateLockUI();
            }

            function updateLockUI() {
                if (!parentLockBtn) return;
                if (isParentAuthenticated()) {
                    parentLockBtn.classList.add('unlocked');
                    parentLockIcon.textContent = '🔓';
                    parentLockLabel.textContent = 'Parent Mode: ON';
                    parentLockBtn.title = 'Parental Controls Unlocked. Click to Lock.';
                } else {
                    parentLockBtn.classList.remove('unlocked');
                    parentLockIcon.textContent = '🔒';
                    parentLockLabel.textContent = 'Parent Lock: ON';
                    parentLockBtn.title = 'Parental Controls Locked. Click to Unlock.';
                }
            }

            let currentPinBuffer = '';
            let pendingPinAction = null;

            function updatePinDots() {
                if (!pinDotsEl) return;
                const dots = pinDotsEl.querySelectorAll('.pin-dot');
                dots.forEach((dot, idx) => {
                    if (idx < currentPinBuffer.length) {
                        dot.classList.add('filled');
                    } else {
                        dot.classList.remove('filled');
                    }
                });
            }

            function handlePinDigit(digit) {
                if (currentPinBuffer.length >= 4) return;
                currentPinBuffer += digit;
                pinErrorMsgEl.textContent = '';
                updatePinDots();

                if (currentPinBuffer.length === 4) {
                    setTimeout(async () => {
                        const enteredHash = await hashPin(currentPinBuffer);
                        if (enteredHash === activePinHash) {
                            setParentAuthenticated(true);
                            hideModal();
                            if (typeof pendingPinAction === 'function') {
                                const action = pendingPinAction;
                                pendingPinAction = null;
                                action();
                            }
                        } else {
                            pinErrorMsgEl.textContent = 'Incorrect PIN. Try again.';
                            pinDotsEl.classList.add('shake');
                            setTimeout(() => {
                                pinDotsEl.classList.remove('shake');
                                currentPinBuffer = '';
                                updatePinDots();
                            }, 500);
                        }
                    }, 120);
                }
            }

            function handlePinBackspace() {
                if (currentPinBuffer.length > 0) {
                    currentPinBuffer = currentPinBuffer.slice(0, -1);
                    pinErrorMsgEl.textContent = '';
                    updatePinDots();
                }
            }

            function handlePinClear() {
                currentPinBuffer = '';
                pinErrorMsgEl.textContent = '';
                updatePinDots();
            }

            function openPinModal(actionCallback, promptText) {
                pendingPinAction = actionCallback;
                currentPinBuffer = '';
                pinErrorMsgEl.textContent = '';
                if (promptText) {
                    pinPromptText.textContent = promptText;
                } else {
                    pinPromptText.textContent = 'Enter PIN to edit break time';
                }
                updatePinDots();
                pinView.style.display = 'block';
                modal.classList.add('visible');
            }

            function hideModal() {
                modal.classList.remove('visible');
                pinView.style.display = 'none';
            }

            function requireParentalPin(actionCallback, promptText) {
                if (isParentAuthenticated()) {
                    actionCallback();
                } else {
                    openPinModal(actionCallback, promptText);
                }
            }

            parentLockBtn.addEventListener('click', () => {
                if (isParentAuthenticated()) {
                    setParentAuthenticated(false);
                } else {
                    openPinModal(() => {}, 'Enter PIN to unlock parent mode');
                }
            });

            if (pinKeypad) {
                pinKeypad.addEventListener('click', (e) => {
                    const btn = e.target.closest('.pin-key-btn');
                    if (!btn) return;
                    const key = btn.dataset.key;
                    if (key !== undefined) {
                        handlePinDigit(key);
                    }
                });
            }

            if (pinClearBtn) pinClearBtn.addEventListener('click', handlePinClear);
            if (pinBackspaceBtn) pinBackspaceBtn.addEventListener('click', handlePinBackspace);

            document.addEventListener('keydown', (e) => {
                if (modal.classList.contains('visible') && pinView && pinView.style.display !== 'none') {
                    if (e.key >= '0' && e.key <= '9') {
                        handlePinDigit(e.key);
                    } else if (e.key === 'Backspace') {
                        handlePinBackspace();
                    } else if (e.key === 'Escape') {
                        hideModal();
                    }
                }
            });

            updateLockUI();

            const BEHAVIOUR_ACTIONS = [
                { name: "Did chores without asking", timeChangeMinutes: -15, type: 'positive' },
                { name: "Read a book", timeChangeMinutes: -10, type: 'positive' },
                { name: "Played outside", timeChangeMinutes: -10, type: 'positive' },
                { name: "Was very kind", timeChangeMinutes: -5, type: 'positive' },
                { name: "Didn't listen", timeChangeMinutes: 5, type: 'negative' },
                { name: "Was unkind to sibling", timeChangeMinutes: 10, type: 'negative' },
                { name: "Didn't do chores", timeChangeMinutes: 15, type: 'negative' },
                { name: "Complained about break", timeChangeMinutes: 5, type: 'negative' },
            ];
            
            function formatTime(totalSeconds) {
                if (totalSeconds < 0) totalSeconds = 0;
                const hours = Math.floor(totalSeconds / 3600).toString().padStart(2, '0');
                const minutes = Math.floor((totalSeconds % 3600) / 60).toString().padStart(2, '0');
                const seconds = (totalSeconds % 60).toString().padStart(2, '0');
                return `${hours}:${minutes}:${seconds}`;
            }
            
            function updateLiveTimer() {
                if (timerInterval) {
                    clearInterval(timerInterval);
                }

                if (currentChild && currentChild.timerState === 'running') {
                    timerInterval = setInterval(() => {
                        const elapsed = Math.floor((Date.now() - currentChild.timerStartTime) / 1000);
                        const remaining = currentChild.breakTimeSeconds - elapsed;
                        if (remaining < 0) {
                            currentTimeEl.textContent = formatTime(0);
                            clearInterval(timerInterval);
                        } else {
                            currentTimeEl.textContent = formatTime(remaining);
                        }
                    }, 1000);
                } else if (currentChild) {
                    currentTimeEl.textContent = formatTime(currentChild.breakTimeSeconds);
                }
            }

            function renderActionButtons() {
                positiveActionsEl.innerHTML = '';
                negativeActionsEl.innerHTML = '';
                BEHAVIOUR_ACTIONS.forEach(action => {
                    const btn = document.createElement('button');
                    btn.className = `action-btn ${action.type}`;
                    const valueText = action.timeChangeMinutes > 0 ? `+${action.timeChangeMinutes}` : action.timeChangeMinutes;
                    btn.innerHTML = `
                        <span>${action.name}</span>
                        <span class="action-value">${valueText} min</span>
                    `;
                    btn.addEventListener('click', () => {
                        requireParentalPin(() => {
                            handleActionClick(action.timeChangeMinutes * 60);
                        }, 'Enter PIN to adjust break time');
                    });
                    
                    if(action.type === 'positive') {
                        positiveActionsEl.appendChild(btn);
                    } else {
                        negativeActionsEl.appendChild(btn);
                    }
                });
            }

            async function handleActionClick(timeChangeSeconds) {
                if (!currentChild) return;
                const childRef = doc(db, childrenCollectionPath, currentChild.id);
                
                let newTime = currentChild.breakTimeSeconds;
                if(currentChild.timerState === 'running'){
                    const elapsed = Math.floor((Date.now() - currentChild.timerStartTime) / 1000);
                    newTime = currentChild.breakTimeSeconds - elapsed;
                }

                if (timeChangeSeconds < 0 && (newTime + timeChangeSeconds < 0) ) {
                    timeChangeSeconds = -newTime;
                }
                
                if (timeChangeSeconds !== 0) {
                    await updateDoc(childRef, {
                        breakTimeSeconds: increment(timeChangeSeconds)
                    });
                }
            }

            const urlParams = new URLSearchParams(window.location.search);
            const childId = urlParams.get('childId');

            if (childId) {
                const childRef = doc(db, childrenCollectionPath, childId);
                onSnapshot(childRef, (docSnap) => {
                    if (docSnap.exists()) {
                        currentChild = { id: docSnap.id, ...docSnap.data() };
                        childNameEl.textContent = currentChild.name;
                        childAgeEl.textContent = `Age: ${currentChild.age || 'N/A'}`;
                        
                        updateLiveTimer();

                        renderActionButtons();

                        loaderEl.style.display = 'none';
                        mainContentEl.style.display = 'flex';

                        // If not authenticated upon landing on adjust page, prompt for PIN
                        if (!isParentAuthenticated()) {
                            openPinModal(() => {}, 'Enter PIN to edit break time');
                        }
                    } else {
                        loaderEl.textContent = "Error: Child not found.";
                    }
                });
            } else {
                loaderEl.textContent = "No child selected. Go back to the main page and click 'Adjust Time' on a child's card.";
            }
        });
    </script>
    <script src="./assets/ios-standalone.js"></script>
</body>
</html>
